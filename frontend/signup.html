<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — CampusPulse</title>
  
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand-logo" aria-label="CampusPulse Home">
        <span class="brand-icon">🎓</span>
        <span>CampusPulse</span>
      </a>
      <a href="index.html" class="btn btn-ghost btn-sm">&larr; Back to Home</a>
    </div>
  </header>

  <main class="main-content" style="display: flex; align-items: center; justify-content: center;">
    <div class="container">
      <div class="form-card">
        <div style="text-align: center; margin-bottom: 2rem;">
          <span class="category-sticker" style="position: static; display: inline-block; margin-bottom: 0.5rem; background: var(--color-green);">
            🚀 Student Onboarding
          </span>
          <h2 style="margin-bottom: 0.5rem;">Join CampusPulse</h2>
          <p style="font-size: var(--text-sm); margin: 0;">Register for hackathons, workshops, and sports meets with mathematical fairness.</p>
        </div>

        <form id="signupForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="signupName">Full Name</label>
            <input type="text" id="signupName" class="input-text" placeholder="e.g. Priya Sharma" required autocomplete="name">
          </div>

          <div class="form-group">
            <label class="form-label" for="signupEmail">College Email Address</label>
            <input type="email" id="signupEmail" class="input-text" placeholder="priya.sharma@college.edu" required autocomplete="email">
          </div>

          <div class="form-group">
            <label class="form-label" for="signupPassword">Password</label>
            <input type="password" id="signupPassword" class="input-text" placeholder="Minimum 8 characters" required minlength="8" autocomplete="new-password">
          </div>

          <div class="form-group">
            <label class="form-label" for="signupConfirmPassword">Confirm Password</label>
            <input type="password" id="signupConfirmPassword" class="input-text" placeholder="Re-enter password" required minlength="8" autocomplete="new-password">
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;" id="btnSignupSubmit">
            Create Account &rarr;
          </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: var(--text-sm);">
          Already have an account? <a href="login.html">Sign In here</a>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { Auth } from './js/auth.js';
    import { setButtonLoading, showToast } from './js/ui.js';

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('signupForm');
      const nameInput = document.getElementById('signupName');
      const emailInput = document.getElementById('signupEmail');
      const passInput = document.getElementById('signupPassword');
      const confirmInput = document.getElementById('signupConfirmPassword');
      const btnSubmit = document.getElementById('btnSignupSubmit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fullName = nameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passInput.value;
        const confirmPassword = confirmInput.value;

        if (!fullName || !email || !password) {
          showToast('Please fill out all required fields.', 'error');
          return;
        }

        if (password.length < 8) {
          showToast('Password must be at least 8 characters long.', 'warning');
          return;
        }

        if (password !== confirmPassword) {
          showToast('Passwords do not match.', 'error');
          return;
        }

        try {
          setButtonLoading(btnSubmit, true, 'Creating Account...');
          await Auth.signUp(fullName, email, password);

          // Verify token exists, otherwise attempt login to acquire session
          const token = localStorage.getItem('campuspulse_auth_token');
          if (!token) {
            await Auth.login(email, password);
          }

          showToast('Account created! Welcome to CampusPulse 🎉', 'success');

          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 450);
        } catch (err) {
          setButtonLoading(btnSubmit, false);
          showToast(err.message || 'Failed to register account.', 'error');
        }
      });
    });
  </script>
</body>
</html>
